{% extends "base.html" %}
{% block content %}
<h1>Your Cart</h1>
<table class="table">
  <thead><tr><th>Pizza</th><th>Qty</th><th>Unit</th><th>Line</th><th></th></tr></thead>
  <tbody id="cart-items"></tbody>
</table>
<p>Total: $<span id="total">0.00</span></p>

<h2>Checkout</h2>
<form id="order-form" method="post" action="/order">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="customer_name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input name="customer_email" type="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" required></textarea>
  </div>
  <!-- hidden cart field appended by JS before submit -->
  <button class="btn btn-success" type="submit">Place Order</button>
</form>
{% endblock %}
